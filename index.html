<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Cubo 3D AR - Anclaje en Espacio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; touch-action: none; }
    
    body {
      background-color: #000000;
      color: white;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      user-select: none;
    }

    /* Transmisión de Cámara */
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
    }

    /* Interfaz Superior */
    .header-ui {
      position: fixed;
      top: 15px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .instruction {
      color: #ffffff;
      font-size: 12px;
      text-align: center;
      background: rgba(0, 0, 0, 0.7);
      padding: 6px 14px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .btn-anchor {
      background: #28a745;
      color: white;
      border: 2px solid white;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      touch-action: auto;
    }

    .btn-anchor.active {
      background: #dc3545;
    }

    /* Escena 3D */
    .scene {
      width: 180px;
      height: 180px;
      perspective: 800px;
      margin-bottom: 60px;
      z-index: 10;
      position: relative;
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transform: scale(1) rotateX(-20deg) rotateY(20deg);
      transition: transform 0.05s ease-out;
    }

    /* Caras del Cubo */
    .face {
      position: absolute;
      width: 180px;
      height: 180px;
      background: rgba(0, 123, 255, 0.82);
      border: 2px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: bold;
      transition: background 0.4s, border 0.4s, transform 0.5s;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.4);
    }

    .front  { transform: rotateY(0deg) translateZ(90px); }
    .back   { transform: rotateY(180deg) translateZ(90px); }
    .right  { transform: rotateY(90deg) translateZ(90px); }
    .left   { transform: rotateY(-90deg) translateZ(90px); }
    .top    { transform: rotateX(90deg) translateZ(90px); }
    .bottom { transform: rotateX(-90deg) translateZ(90px); }

    /* Estado: Aristas */
    .cube.aristas .face {
      background: rgba(0, 255, 204, 0.08) !important;
      border: 4px solid #00ffcc !important;
      box-shadow: 0 0 15px #00ffcc;
      color: #00ffcc;
    }

    /* Estado: Desarmado */
    .cube.desarmado .front  { transform: rotateY(0deg) translateZ(190px); background: rgba(255, 71, 87, 0.85); }
    .cube.desarmado .back   { transform: rotateY(180deg) translateZ(190px); background: rgba(255, 165, 2, 0.85); }
    .cube.desarmado .right  { transform: rotateY(90deg) translateZ(190px); background: rgba(46, 213, 115, 0.85); }
    .cube.desarmado .left   { transform: rotateY(-90deg) translateZ(190px); background: rgba(30, 144, 255, 0.85); }
    .cube.desarmado .top    { transform: rotateX(90deg) translateZ(190px); background: rgba(83, 82, 237, 0.85); }
    .cube.desarmado .bottom { transform: rotateX(-90deg) translateZ(190px); background: rgba(255, 107, 129, 0.85); }

    /* Botonera Inferior */
    .controls {
      position: fixed;
      bottom: 30px;
      display: flex;
      gap: 10px;
      z-index: 100;
      touch-action: auto;
    }

    .btn {
      background-color: rgba(0, 123, 255, 0.9);
      color: white;
      border: 2px solid white;
      padding: 12px 18px;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      backdrop-filter: blur(4px);
    }

    .btn:active { background-color: #0056b3; }
  </style>
</head>
<body>

  <!-- Transmisión de Cámara Web -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Panel Superior -->
  <div class="header-ui">
    <button id="btn-anchor" class="btn-anchor" onclick="toggleAnchor()">📌 Fijar Cubo en Espacio</button>
    <div class="instruction">
      👆 1 dedo: Rotación manual | 🤌 2 dedos: Zoom<br>
      📱 Activa "Fijar Cubo" para explorar moviendo el celular
    </div>
  </div>

  <!-- Escena Tridimensional -->
  <div class="scene">
    <div id="cube" class="cube entero">
      <div class="face front">1</div>
      <div class="face back">2</div>
      <div class="face right">3</div>
      <div class="face left">4</div>
      <div class="face top">5</div>
      <div class="face bottom">6</div>
    </div>
  </div>

  <!-- Estados Geométricos -->
  <div class="controls">
    <button class="btn" onclick="setVista('entero')">Sólido</button>
    <button class="btn" onclick="setVista('aristas')">Aristas</button>
    <button class="btn" onclick="setVista('desarmado')">Desarmado</button>
  </div>

  <script>
    // 1. Inicialización de Cámara Trasera
    async function initCamera() {
      const video = document.getElementById('camera-feed');
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        try {
          const fallback = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
          video.srcObject = fallback;
        } catch (e) {
          alert("Permite el acceso a la cámara para activar la realidad aumentada.");
        }
      }
    }
    window.addEventListener('DOMContentLoaded', initCamera);

    // 2. Control de Estados y Orientación
    const cube = document.getElementById('cube');
    const btnAnchor = document.getElementById('btn-anchor');
    
    let isAnchored = false;
    let isDragging = false;
    let previousPos = { x: 0, y: 0 };
    
    let rotX = -20;
    let rotY = 20;
    let scale = 1.0;
    
    let baseAlpha = 0;
    let baseBeta = 0;
    let baseGamma = 0;
    
    let initialPinchDistance = null;
    let initialScale = 1.0;

    function renderTransform() {
      cube.style.transform = `scale(${scale}) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
    }

    // Activar/Desactivar Anclaje de Giroscopio
    function toggleAnchor() {
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(response => {
          if (response === 'granted') {
            switchAnchorState();
          } else {
            alert('Se requiere permiso de giroscopio para fijar el objeto.');
          }
        });
      } else {
        switchAnchorState();
      }
    }

    function switchAnchorState() {
      isAnchored = !isAnchored;
      if (isAnchored) {
        btnAnchor.textContent = "🔓 Liberar Posición";
        btnAnchor.classList.add('active');
      } else {
        btnAnchor.textContent = "📌 Fijar Cubo en Espacio";
        btnAnchor.classList.remove('active');
      }
    }

    // Listener de Giroscopio (Orientación Física del Teléfono)
    window.addEventListener('deviceorientation', (e) => {
      if (!isAnchored) return;

      const pitch = e.beta || 0;  // Inclinación frontal (-180 a 180)
      const yaw = e.alpha || 0;    // Rotación sobre eje Z (0 a 360)

      // Se compensa el movimiento del móvil para mantener el cubo estático
      rotX = -pitch * 0.8;
      rotY = -yaw * 0.8;
      renderTransform();
    });

    // Controles Táctiles Manuales
    function getDistance(touches) {
      const dx = touches[0].clientX - touches[1].clientX;
      const dy = touches[0].clientY - touches[1].clientY;
      return Math.hypot(dx, dy);
    }

    window.addEventListener('touchstart', (e) => {
      if (e.target.tagName === 'BUTTON') return;

      if (e.touches.length === 1) {
        isDragging = true;
        previousPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2) {
        isDragging = false;
        initialPinchDistance = getDistance(e.touches);
        initialScale = scale;
      }
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches.length === 1 && isDragging && !isAnchored) {
        rotY += (e.touches[0].clientX - previousPos.x) * 0.7;
        rotX -= (e.touches[0].clientY - previousPos.y) * 0.7;
        renderTransform();
        previousPos = { x: e.touches[0].clientX, y: e.touches[0].clientY };
      } else if (e.touches.length === 2 && initialPinchDistance) {
        const factor = getDistance(e.touches) / initialPinchDistance;
        scale = Math.min(Math.max(initialScale * factor, 0.4), 2.5);
        renderTransform();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.touches.length < 2) initialPinchDistance = null;
      if (e.touches.length === 0) isDragging = false;
    });

    function setVista(modo) {
      cube.classList.remove('entero', 'aristas', 'desarmado');
      cube.classList.add(modo);
    }
  </script>
</body>
</html>
